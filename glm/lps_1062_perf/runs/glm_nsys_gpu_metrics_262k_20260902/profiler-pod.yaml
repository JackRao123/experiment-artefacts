apiVersion: v1
kind: Pod
metadata:
  name: jackrao-glm-nsys-b300
  namespace: org-99340d71961343c28c5c567d705ab0c0
  labels:
    app: jackrao-glm-nsys-b300
    purpose: internal-profiling
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    baseten.co/gpu-type: nvidia-b300
    baseten-internal/customer-reservation: charles--parsed--com
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: baseten-internal/customer-reservation
      operator: Equal
      value: charles--parsed--com
      effect: NoSchedule
  containers:
    - name: profiler
      image: nvidia/cuda:13.0.3-devel-ubuntu24.04
      command: ["bash", "-lc", "sleep infinity"]
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          add: ["SYS_ADMIN"]
          drop: ["CAP_NET_RAW", "CAP_NET_ADMIN"]
      env:
        - name: HF_HOME
          value: /root/.cache/team_artifacts/huggingface
        - name: TRANSFORMERS_CACHE
          value: /root/.cache/team_artifacts/huggingface
        - name: UV_CACHE_DIR
          value: /root/.cache/user_artifacts/uv-cache
        - name: UV_LINK_MODE
          value: copy
        - name: OTEL_SDK_DISABLED
          value: "true"
      resources:
        requests:
          cpu: "180"
          memory: 2400Gi
          ephemeral-storage: 1Ti
          nvidia.com/gpu: "8"
        limits:
          cpu: "182"
          memory: 2450Gi
          ephemeral-storage: 2Ti
          nvidia.com/gpu: "8"
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: project-cache
          mountPath: /root/.cache/user_artifacts
          subPath: dq47r1q/user_artifacts
        - name: project-cache
          mountPath: /root/.cache/team_artifacts
          subPath: team_qzr5p83
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 512Gi
    - name: project-cache
      persistentVolumeClaim:
        claimName: org-99340d71961343c28c5c567d705ab0c0-training-provider-sfs-pvc
